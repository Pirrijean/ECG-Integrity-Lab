[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-integrity-lab"
version = "0.2.0"
description = "Open ECG Signal Conditioning & QRS Detector Verification Framework"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Pirrijean"}
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pandas>=2.1.0",
    "matplotlib>=3.8.0",
    "wfdb>=4.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
ecg-integrity = "ecg_integrity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
